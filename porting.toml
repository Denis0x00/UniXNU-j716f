procedure = ["Compile the DTS, enable the reviewed ArmCpu implementation, and verify CPU entry, timer and IPI checkpoints."]
findings = ["Only the single boot CPU and shared resource addresses are currently audited; no multi-core XNU entry has been established.", "The source qualification keeps ArmCpu disabled, so the profile's MOCKFS executable-root fixture is disabled rather than claiming CPU component support."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on the selected cores."]
