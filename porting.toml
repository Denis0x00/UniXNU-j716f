configuration = ["The board DTS records the primary 0xc0000000/0x140000000 bank; the diagnostic payload separately requests 0x10000000 owned bytes."]
procedure = ["Audit the memory map on the host, then allocate, cache-maintain, read back and release the V14 window on boot_b."]
findings = ["The V14 256 MiB physical window passed seven checks, including two complete write/read rounds with cache maintenance and release; this does not validate full DRAM ownership.", "V21 host audit confirms the same embedded FAT payload and module GUID set as V20; this does not add a new RAM qualification result."]
