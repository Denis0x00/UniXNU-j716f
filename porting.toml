  "Added Test 11 (J716fA650GmuContextTest under ASan/UBSan against unmodified upstream kits/ArmSmmu4K) in j716f-ci.yml and documented optional local J716F_GPU_FIRMWARE_DIR extraction in proprietary-files.txt.",
  "Added Test 12 (J716fA650CpTest under ASan/UBSan against unmodified upstream kits/ArmSmmu4K and kits/AdrenoPM4) in j716f-ci.yml.",
  "Added Test 13 (J716fA650ZapTest under ASan/UBSan covering ELF32 MDT parsing, SM8250 SCM PAS 13 auth, PIL unmap ordering, and CP SMMU aperture) and initialized upstream drivers/Adreno740 and drivers/AdrenoMetal submodules in j716f-ci.yml.",
  "Added .github/workflows/j716f-gpu-addon.yml (macOS runner) to build Phase 4b userspace gpuaddon.bin (NativeAdrenoMetal.bundle + Mesa Turnip + metal2vulkan for arm64-apple-ios17.0) and trust.json CDHashes.",
  "Updated .github/workflows/j716f-gpu-addon.yml with Cargo registry caching and generated metal2vulkan-runtime iOS patch 0065 (copied.rs vm_read_overwrite + host_memory.rs mach_vm_region).",
