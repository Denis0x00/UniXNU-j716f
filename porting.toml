schema_version = 1

[device]
name = "j716f"
soc = "SM8250"
os_profile = "ipados-17.7.11-21H461"
summary = "Lenovo Xiaoxin Pad Pro 2021 (TB-J716F, SM8250-AC) consolidated onto the official UniXNU Format 2 device repository layout alongside the r38 companion UEFI repository (Denis0x00/uefi-j716f). Hardware-verified through UEFI menu, retained early XNU logs (JXLG), real iPadOS 17.7.11 APFS root mount, 8-core Kryo 585 SMP + Edge scheduler + SM8250-AC EPSS CPUfreq/L3 scaling, GopFramebuffer + AppleKeyStoreState, Goodix GT7386 I2C touch, PM8150 SPMI hardware buttons (Power/VolUp/VolDown + lock/wake), kernel-side skip-setup plist seeding, and interactive iPadOS 17.7.11 SpringBoard desktop with wallpaper. Next milestones: persistent Data storage (converging onto ShengUfs), backlight/Wi-Fi/audio, and Adreno 650 GPU acceleration."

