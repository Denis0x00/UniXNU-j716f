schema_version = 1

[device]
name = "j716f"
soc = "SM8250"
os_profile = "ipados-17.7.11-21H461"
summary = "Lenovo Xiaoxin Pad Pro 2021 (TB-J716F, SM8250-AC) consolidated onto the official UniXNU Format 2 device repository layout alongside the r38 companion UEFI repository (Denis0x00/uefi-j716f). Hardware-verified through UEFI oc-like menu, retained early XNU logs (JXLG), bare-metal DWC3 USB CDC-ACM debug terminal, real iPadOS 17.7.11 APFS root mount, opt-in persistent UFS Data (j716f-data-persist=2), 8-core Kryo 585 SMP + Edge scheduler + SM8250-AC EPSS CPUfreq/L3 scaling, GopFramebuffer + AppleKeyStoreState, Goodix GT7386 I2C touch, PM8150 SPMI hardware buttons, PM8150B battery/charger telemetry, Adreno 650 full KMD + AdrenoMetal/Turnip 3D acceleration, and fb-gpu=1 GPU scanout handoff with A650 RW-import IO-coherence. Next milestones: DSI backlight control, Wi-Fi/Bluetooth (QCA6390), audio, and upstream ShengUfs SM8250 convergence."

