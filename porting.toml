  "Verified Format 2 tree layout path out/j716f/ipados-17.7.11-21H461/j716f/tree in CI.",
  "Initialized the 5 required UniXNU component submodules in CI before running ./unixnu status and ./unixnu tree, and passed hex string unique_chip_id to devicetree.generate().",
  "Extracted two self-contained upstream PR patches under patches/unixnu-core/ (AAPL,phandle emission in devicetree.py and Android bootimg v2 support + unit tests in bootimg.py) and added standard .github/workflows/package.yml; CI verifies clean git apply, test_bootimg.py, and AAPL,phandle presence in the generated ADT against upstream UniXNU/UniXNU.",
  "Added Stage 7 host-build defconfig (configs/j716f_stage7_defconfig), RamBlock embedded component selection, and platform ADT defaults (vmm-present=1, sleep-disabled=1, kernel-ctrr-to-be-enabled=0, packed_data_ramdisk=true, owned_memory_size=2 GiB).",
