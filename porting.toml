schema_version = 1

[device]
name = "j716f"
soc = "SM8250"
os_profile = "ipados-17.7.11-21H461"
summary = "Lenovo Xiaoxin Pad Pro 2021 (TB-J716F, SM8250-AC) consolidated onto the official UniXNU Format 2 device repository layout alongside the r38 companion UEFI repository (Denis0x00/uefi-j716f). UEFI menu, display ownership, keys, QR log export, retained early XNU logs, single-core CPU0 BSD bring-up, and read-only SHNGROOT UFS/APFS container probing have been verified in staged hardware trials; full vfs_mountroot() completion, upstream ShengUfs/RamBlock/Data convergence, and Stage 7 userland remain in progress."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = [
  "board.toml",
  "feeds.toml",
  "unixnu.lock",
  "configs/**",
  "patches/**",
  "socs/sm8250/soc.toml",
  "socs/sm8250/configs/**",
  "socs/sm8250/patches/**",
  "AGENTS.md",
  "README.md",
  "LICENSE",
  ".gitattributes",
  ".gitignore",
  ".github/**",
  "local.toml.example",
  "proprietary-files.txt",
]
inputs = [
  "Lenovo Xiaoxin Pad Pro 2021 (TB-J716F), Snapdragon 870 (SM8250-AC), arm64, iPadOS 17.7.11 (21H461).",
  "Upstream UniXNU Format 2 build system (UniXNU/UniXNU) and companion firmware repository (Denis0x00/uefi-j716f).",
]
configuration = [
  "board.toml uses schema_version = 2 with example = false, os_profile = ipados-17.7.11-21H461, and 5 core components.",
  "configs/j716f_defconfig enables CONFIG_XNU_DT_PANIC_REGION and links the consolidated read-only storage archive libJ716fStorageBringup.a.",
  "feeds.toml points the sm8250 SoC feed to socs/sm8250; unixnu.lock pins upstream Apple OSS and mu_basecore commits.",
]
procedure = [
  "Run ./unixnu defconfig j716f_defconfig -D ../UniXNU-j716f --os 17 followed by ./unixnu status --json --os 17 and ./unixnu tree --os 17.",
  "Run ./unixnu build package --os 17, ./unixnu build firmware --os 17 --uefi ../uefi-j716f, and ./unixnu build kernel --os 17.",
]
findings = [
  "Consolidated the split experimental targets into a single official UniXNU Format 2 device repository with clean root-level board.toml, package/, patches/, and scripts/.",
  "Removed local-only core PCD coupling (J716F_MENU_DIAGNOSTIC) from default board.toml firmware defines so the board builds cleanly against unmodified upstream UniXNU/UniXNU.",
  "Excluded proprietary vendor DTB binaries and private device seeds from Git; documented user extraction in proprietary-files.txt.",
]
completion = [
  "Official ./unixnu defconfig, status, tree, package, firmware, kernel, payload, and bootimg succeed cleanly from this single Format 2 repository.",
]
limits = [
  "Hardware bootimg assembly requires a user-supplied normalized stock DTB (DTB0 + DTBO1) and UNIXNU_UNIQUE_CHIP_ID outside Git.",
  "Single-core CPU0 bring-up defconfig intentionally excludes SMP/power/display/GPU optional drivers until Stage 6 root mount is complete.",
]
next_action = [
  "Complete live vfs_mountroot() verification on TB-J716F boot_b and converge storage onto upstream ShengUfs.",
]
[[area.evidence]]
kind = "source"
reference = "board.toml"
result = "Format 2 board manifest defining kernel, firmware, device tree, userdata geometry, payload, and bootimg settings"
[[area.evidence]]
kind = "source"
reference = "configs/j716f_defconfig"
result = "Consolidated TB-J716F single-core bring-up kernel defconfig"

