schema_version = 1

[device]
name = "j716f"
soc = "SM8250"
os_profile = "ipados-17.7.11-21H461"
summary = "Lenovo TB-J716F migration record for the UniXNU iPadOS 17.7.11 bring-up."

[[area]]
id = "configuration"
status = "host-verified"
components = ["XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", "socs/**", ".github/**", ".gitignore", "local.toml.example"]
inputs = ["SM8250/Kona identity, iPadOS 17.7.11 profile candidate, source defconfig, and the local SoC evidence snapshot."]
configuration = ["board.toml uses schema_version 2, soc_source sm8250, os_profile ipados-17.7.11-21H461, and device:dts/j716f.dts.", "The source qualification defconfig remains the reproducible kernel configuration; it does not claim a bootable XNU."]
procedure = ["Run the latest UniXNU defconfig, status, tree, and porting-record checks from the UniXNU checkout."]
findings = ["No reviewed public UniXNU-sm8250-common repository was available, so the board-local source is explicitly marked as a transition snapshot.", "The macOS source workflow is pinned to UniXNU 42bffe8 and keeps its J716F compatibility fixes in the device repository.", "The source qualification defconfig disables the profile's MOCKFS fixture because that fixture requires ArmCpu, while this board intentionally keeps ArmCpu disabled.", "The source-output sealing step discovers the migration-qualified report and tree instead of assuming the legacy out/j716f root."]
completion = ["The format 2 identity, source paths, defconfig, and patch order resolve without ambiguous board fields."]
limits = ["The SoC source is local and not yet a reusable fixed public commit; component ABI inputs remain incomplete."]
next_action = ["Extract the shared SM8250 resources into a reviewed UniXNU-sm8250-common repository and pin its 40-character commit."]

[[area.evidence]]
kind = "host"
reference = "board.toml"
result = "Format 2 board identity and migration fields are present."
command = "python3 scripts/porting-record.py check --device ../UniXNU-j716f"
revision = "f82228a9e166603d6a8b522bf0214db3379fad0d"

[[area]]
id = "firmware"
status = "device-verified"
components = []
paths = ["proprietary-files.txt", "scripts/check-j716f.py", "docs/V14_MEMORY_WINDOW.md", "docs/V15_ENTRY_DIAGNOSTIC.md", "docs/V16_SOURCE_ENTRY_RESULT.md"]
inputs = ["Mu-Silicium J716F platform, inherited GOP, fixed ZUI memory map, and the board UEFI DSC/FDF."]
configuration = ["The device board points to the j716f DSC/FD and keeps vendor inputs outside the public repository."]
procedure = ["Build the diagnostic FD with the local UEFI checkout, audit its inputs, then boot only through boot_b for hardware checks."]
findings = ["V14 reached the UniXNU menu and exercised the documented button and DarwinBoot protocol paths.", "V16 on boot_b displayed the green ExitBootServices bar, the blue MMU-off XNU entry probe and the magenta pre-MMU-enable probe; the screen also showed the normal CapsuleRuntimeDxe LockCapsuleInterface callback."]
completion = ["The FD enters UniXNU, preserves the documented memory reservations, and exposes the framebuffer for the menu."]
limits = ["MMU-on persistence, ArmCpu/ArmDTPlatform initialization, UFS/root, userspace and iPadOS remain unverified; TzDxe is out of scope."]
next_action = ["Build V17 with a persistent post-MMU diagnostic stop and verify it on boot_b."]

