completion = ["Actual native kernel/prelink artifacts with pinned inputs and complete logs."]
limits = ["Independent new kernel build and verification are pending. Runtime ABI and device behavior remain unqualified."]
next_action = ["Run official kernel build, verify seven archive members and unique owner/bringup/runtime exports, reparse new checkpoint addresses and archive independently."]
