schema_version = 2

[board]
example = false
name = "j716f-xnu-bsd-pre-root-probe"
kit = "j716f-xnu-bsd-pre-root-probe"
soc = "SM8250"
soc_source = "sm8250"
os_profile = "ipados-17.7.11-21H461"
description = "TB-J716F r30 BSD inittodr return checkpoint before root lookup; reuse r29 source kernel, ADT and logging firmware; host preparation only"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]

[kernel]
# Reuse accepted host-iokit-cpu0 pristine source kernel from r29; no kernel build.
defconfig = "j716f_xnu_bsd_pre_root_probe_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "device:patches/xnu/ipados17-series", "device:patches/xnu/series"]

[device_tree]
source = "device:dts/j716f.dts"
include_dirs = ["soc:dts"]

[firmware]
# The reviewed archive and its independent FD hash are mandatory builder inputs.
config = "j716f"

[bootimg.image]
header_version = 2
pagesize = 4096

[payload]
volume = "J716FENTRY"
size_mib = 80
loader = "firmware"
title = "Start XNU (BSD pre-root checkpoint)"
kernel_args = ["-v", "serial=3", "j716f-earlylog=1"]
timeout = -1
tools = true
# Keep original panic functions and upstream patcher/padding bounds intact.
panic_screen = false
# Official stage 4 replaces stage 3; wait after inittodr returns in bsd_init.
# Restore IOKitBSDInit, sysctl_mib_init, kperf_init_early and all older hooks.
entry_probe_reset_delay = 6
entry_probe_reset_after = "_inittodr"
entry_probe_reset_in = "_bsd_init"
entry_probe_reset_occurrence = 1
entry_probe_reset_before = false

[payload.adt]
chip_id = "8011"
unique_chip_id = "required"
psci_method = "smc"
owned_memory_size = 0x10000000

[package]
unixnu = "../UniXNU-core-adt-phandle-r23"
boot_partition_bytes = 100663296

[package.defconfig]
"ipados-17.7.11-21H461" = "j716f_xnu_bsd_pre_root_probe_defconfig"
