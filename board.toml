schema_version = 2

[board]
example = false
name = "j716f"
kit = "j716f"
soc = "SM8250"
soc_source = "sm8250"
os_profile = "ipados-17.7.11-21H461"
description = "Lenovo Xiaoxin Pad Pro 2021 TB-J716F UniXNU bring-up"

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "j716f_defconfig"

[components]
