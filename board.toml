schema_version = 2

[board]
example = false
name = "j716f"
kit = "j716f"
soc = "SM8250"
soc_source = "sm8250"
os_profile = "ipados-17.7.11-21H461"
description = "Lenovo Xiaoxin Pad Pro 2021 (TB-J716F) iPadOS 17.7.11 bring-up"

[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "RamBlock", "GopFramebuffer", "AppleKeyStoreState", "XnuPrelink", "DarwinBoot", "AdrenoFirmware", "AdrenoPM4", "ArmSmmu4K"]

[kernel]
defconfig = "j716f_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ipados.config"]
# Enable SM8250 8-core SMP + E/P cluster Edge scheduler (secondary cores remain opt-in via smp=1).
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "device:patches/xnu/ipados17-series", "device:patches/xnu/series"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  "prepare-storage-headers.py",
  "build-j716f-storage-active.py",
  "build-j716f-display-keystore.py",
]

[kernel.embedded_components]
RamBlock = "build-j716f-storage-active.py"
GopFramebuffer = "build-j716f-display-keystore.py"
AppleKeyStoreState = "build-j716f-display-keystore.py"

[device_tree]
source = "device:dts/j716f.dts"
include_dirs = ["soc:dts"]

[firmware]
# Companion ../uefi-j716f carries the consolidated r38 menu, DarwinBoot, early-log and UFS handoff integration.
config = "j716f"
dsc = "Platforms/Lenovo/j716fPkg/j716f.dsc"
fd = "Build/j716fPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
submodules = ["Common/Mu", "Common/Mu_OEM_Sample"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Lenovo",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{edk2}",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
]

[firmware.defines]
DEVICE_MODEL = "j716f"
ENABLE_SECUREBOOT = 0
# Optional: enable J716F_MENU_DIAGNOSTIC = 1 only when the companion UniXNU
# checkout has uefi-j716f/Resources/UniXNUPatches/j716f-menu-hold.patch applied.

[bootimg]
# User-supplied normalized stock DTB0 + DTBO1 placed locally at
# package/firmware/j716f-stock-base00-overlay01-normalized.dtb (excluded from Git;
# see proprietary-files.txt) or overridden via --dtb.
dtb = "kits/j716f/firmware/j716f-stock-base00-overlay01-normalized.dtb"
max_image_bytes = 100663296

[bootimg.image]
header_version = 2
pagesize = 4096

[userdata]
# Measured TB-J716F LUN 0 GPT geometry for userdata.
first_lba = 2315048
last_lba = 30693370
lba_bytes = 4096

[payload]
volume = "J716FENTRY"
size_mib = 80
loader = "firmware"
title = "TB-J716F iPadOS 17 (APFS root)"
# Omit -v so XNU keeps kPEGraphicsMode (no scrolling text over SpringBoard);
# serial=3 j716f-earlylog=1 retains full kernel logs in the JXLG RAM ring.
kernel_args = ["serial=3", "j716f-earlylog=1"]
timeout = -1
tools = true
panic_screen = false
trust_cache_sha256 = ["7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7"]

[payload.adt]
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"
chip_id = "8011"
unique_chip_id = "required"
psci_method = "smc"
packed_data_ramdisk = true
owned_memory_size = 0x80000000

[adt.product.string]
artwork-display-gamut = "sRGB"

[adt.product.u32]
thin-bezel = 1

[adt.defaults.u32]
sleep-disabled = 1
# No Apple PMGR or SEP: report a virtual platform so AMFI does not wait for ApplePMGRNub.
vmm-present = 1
"kern.maxvnodes" = 66560

[adt.chosen.u32]
# SM8250 has no Apple CTRR hardware.
kernel-ctrr-to-be-enabled = 0

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

[package]
unixnu = "../UniXNU"
boot_partition_bytes = 100663296

[package.defconfig]
"ipados-17.7.11-21H461" = "j716f_defconfig"
