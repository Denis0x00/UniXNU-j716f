name: J716F device CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Format 2 CLI, DTS/ADT, C++ sanitizer tests & porting record
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout UniXNU-j716f
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: device
          persist-credentials: false

      - name: Checkout upstream UniXNU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: unixnu
          persist-credentials: false

      - name: Initialize required UniXNU component submodules
        run: |
          git -C unixnu submodule update --init --depth 1 \
            drivers/ArmDTPlatform \
            drivers/ArmCpu \
            drivers/SoftwareAES \
            drivers/RamBlock \
            drivers/GopFramebuffer \
            drivers/AppleKeyStoreState \
            drivers/DarwinBoot \
            kits/XnuPrelink \
            kits/AdrenoFirmware \
            kits/AdrenoPM4 \
            kits/ArmSmmu4K \
            drivers/Adreno740 \
            drivers/AdrenoMetal

      - name: Install host tools (dtc, clang++)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            device-tree-compiler clang

      - name: Check repository hygiene (LF, modes, no proprietary binaries)
        run: |
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          device = Path('device')
          tracked = subprocess.check_output(['git', '-C', str(device), 'ls-files', '--stage', '-z']).split(b'\0')
          forbidden_ext = {'.dtb', '.dtbo', '.img', '.fd', '.macho', '.ipsw', '.dmg', '.dbr', '.hex', '.key', '.pem'}
          index = {}
          for row in tracked:
              if not row:
                  continue
              meta, raw_name = row.split(b'\t', 1)
              mode, sha, _ = meta.decode().split()
              name = raw_name.decode()
              index[name] = mode
              ext = Path(name).suffix.lower()
              if ext in forbidden_ext:
                  raise SystemExit(f'Forbidden binary/private artifact in Git: {name}')
              if name.startswith(('patches/', 'scripts/', 'configs/', 'dts/')) or name.endswith(('.sh', '.py', '.toml', '.patch')):
                  if b'\r\n' in (device / name).read_bytes():
                      raise SystemExit(f'Expected LF line endings: {name}')

          if index.get('scripts/package.sh') != '100755':
              raise SystemExit(f'Expected executable bit on scripts/package.sh, got {index.get("scripts/package.sh")}')
          print(f'Verified {len(index)} tracked files: LF endings, executable mode, 0 forbidden binaries')
          PY

      - name: Check shell and Python syntax + Data seed unit tests
        run: |
          bash -n device/scripts/package.sh
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for py in sorted(Path('device').rglob('*.py')):
              ast.parse(py.read_text(encoding='utf-8'), filename=str(py))
          print('Python syntax checks passed')
          PY
          PYTHONPATH="$PWD/device/scripts/ci" python3 -m unittest discover -s device/scripts/ci -p 'test_*.py' -v

      - name: Validate UniXNU Format 2 CLI (defconfig, status, tree)
        run: |
          set -euo pipefail
          DEVICE="$PWD/device"
          cd unixnu
          # Default j716f_defconfig (promoted Stage 7+ desktop configuration)
          ./unixnu defconfig j716f_defconfig -D "$DEVICE" --os 17
          ./unixnu status --json --os 17 > "$RUNNER_TEMP/status.json"
          cat "$RUNNER_TEMP/status.json"
          ./unixnu tree --os 17
          TREE="out/j716f/ipados-17.7.11-21H461/j716f/tree"
          test -f "$TREE/drivers/RamBlock/NativeRamBlock.cpp"
          test -f "$TREE/drivers/GopFramebuffer/NativeLegacyDisplay.cpp"
          test -f "$TREE/drivers/AppleKeyStoreState/NativeKeyStoreEvents.cpp"
          test -f "$TREE/kits/j716f/storage/J716fStorageBringup.cpp"
          test -f "$TREE/kits/j716f/storage/r41/R41RootWindowDevice.cpp"
          test -f "$TREE/kits/j716f/storage/r41/R41Entry.cpp"
          test -f "$TREE/kits/j716f/display/J716fLegacyDisplayProbe.cpp"
          test -f "$TREE/kits/j716f/display/J716fKeyStoreProbe.cpp"
          test -f "$TREE/kits/j716f/display/J716fBacklight.cpp"
          test -f "$TREE/kits/j716f/display/J716fBacklightDsi.h"
          test -f "$TREE/kits/j716f/display/J716fDpuScanout.cpp"
          test -f "$TREE/kits/j716f/display/J716fDpuSmmu.h"
          test -f "$TREE/kits/j716f/wireless/J716fWcnBoard.h"
          test -f "$TREE/kits/j716f/wireless/J716fWcnProbe.cpp"
          test -f "$TREE/kits/j716f/input/NativeHidInput.cpp"
          test -f "$TREE/kits/j716f/input/J716fTouchProbe.cpp"
          test -f "$TREE/kits/j716f/input/J716fButtons.c"
          test -f "$TREE/kits/j716f/power/J716fCpuFreq.cpp"
          test -f "$TREE/kits/j716f/power/J716fBattery.cpp"
          test -f "$TREE/kits/j716f/gpu/J716fGpuProbe.cpp"
          test -f "$TREE/kits/j716f/gpu/J716fA650Gmu.c"
          test -f "$TREE/kits/j716f/gpu/J716fA650GmuContext.c"
          test -f "$TREE/kits/j716f/gpu/J716fA650Cp.c"
          test -f "$TREE/kits/AdrenoFirmware/AdrenoHfiStartup.c"
          test -f "$TREE/kits/AdrenoPM4/AdrenoPM4.c"
          test -f "$TREE/kits/ArmSmmu4K/ArmSmmu4K.h"
          test -f "$TREE/kits/ArmSmmu4K/ArmSmmu4KStreams.c"
          test -f "$TREE/kits/j716f/usb/J716fUsbDebugCdc.cpp"
          test -f "$TREE/scripts/build-j716f-storage-active.py"
          test -f "$TREE/scripts/build-j716f-display-keystore.py"

          # Stage 6 minimal bring-up baseline (preserved; omit --os so active defconfig is not overridden by [package.defconfig])
          ./unixnu defconfig j716f_stage6_defconfig -D "$DEVICE"
          ./unixnu status --json > "$RUNNER_TEMP/status-stage6.json"
          ./unixnu tree
          TREE6="out/j716f/ipados-17.7.11-21H461/j716f_stage6/tree"
          test -f "$TREE6/kits/j716f/storage/r41/R41RootWindowDevice.cpp"

          # Stage 7+ compatibility alias
          ./unixnu defconfig j716f_stage7_defconfig -D "$DEVICE"
          ./unixnu status --json > "$RUNNER_TEMP/status-stage7.json"
          ./unixnu tree
          TREE7="out/j716f/ipados-17.7.11-21H461/j716f_stage7/tree"
          test -f "$TREE7/drivers/GopFramebuffer/NativeLegacyDisplay.cpp"

      - name: Verify and apply board-level UniXNU core patches and package.sh --check
        run: |
          set -euo pipefail
          for patch in device/patches/unixnu-core/*.patch; do
            git -C unixnu apply --check "$PWD/$patch"
            git -C unixnu apply "$PWD/$patch"
          done
          python3 unixnu/scripts/unixnu/test_bootimg.py -v
          python3 - <<'PY'
          import tomllib
          from pathlib import Path
          board = tomllib.loads(Path('device/board.toml').read_text(encoding='utf-8'))
          cmdline = ' '.join(board['payload']['kernel_args'])
          assert len(cmdline) < 1000, f'kernel_args too long: {len(cmdline)}'
          install = board['payload']['install']
          assert install['confirm'] and len(install['confirm_titles']) == len(install['confirm_args'])
          print(f'Verified board-level core patches (0001..0002) and board.toml payload cmdline ({len(cmdline)} bytes)')
          PY
          ln -sfn "$PWD/unixnu" "$PWD/UniXNU"
          device/scripts/package.sh --no-deps --check --os 17

      - name: Compile DTS with dtc and verify Apple Device Tree (ADT) generation
        run: |
          set -euo pipefail
          DTB="$RUNNER_TEMP/j716f.dtb"
          dtc -I dts -O dtb -@ -i device/socs/sm8250/dts -o "$DTB" device/dts/j716f.dts
          python3 - "$DTB" <<'PY'
          import sys
          import tomllib
          from pathlib import Path

          sys.path.insert(0, str(Path('unixnu/scripts').resolve()))
          from unixnu import devicetree

          board = tomllib.loads(Path('device/board.toml').read_text(encoding='utf-8'))
          assert board['payload']['adt']['owned_memory_size'] == 0x110000000, (
              f"Unexpected owned_memory_size: {board['payload']['adt']['owned_memory_size']:#x}"
          )
          adt = devicetree.generate(
              Path(sys.argv[1]),
              board,
              unique_chip_id='0123456789abcdef',
              data=True,
              trust=True,
          )
          assert len(adt) > 4096, f'Unexpected small ADT size: {len(adt)}'
          for needle in (
              b'AAPL,phandle\x00',
              b'vmm-present\x00',
              b'kernel-ctrr-to-be-enabled\x00',
              b'PackedRAMDisk\x00',
              b'darwinboot-memory-size\x00',
              b'cpu7\x00',
              b'cluster-type\x00',
              b'buttons\x00',
          ):
              assert needle in adt, f'Generated ADT is missing {needle!r}'
          print(f'Generated valid Stage 7 Apple Device Tree ({len(adt)} bytes) from compiled dts/j716f.dts')
          PY

      - name: Compile and run SM8250 UFS/SMMU and r41 SHNGROOT C++ ASan/UBSan tests
        run: |
          set -euo pipefail
          PLAT="device/socs/sm8250/kits/Sm8250Platform"
          STOR="device/package/storage"
          OUT="$RUNNER_TEMP/j716f-tests"
          mkdir -p "$OUT"

          CXXFLAGS="-std=c++17 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer"
          export ASAN_OPTIONS="detect_leaks=1:halt_on_error=1"
          export UBSAN_OPTIONS="halt_on_error=1:print_stacktrace=1"

          echo "=== Test 1: AppsSmmuOwner (multi-TU) ==="
          clang++ $CXXFLAGS -pthread -I"$PLAT" \
            "$PLAT/AppsSmmuOwner.cpp" \
            "$PLAT/tests/AppsSmmuOwner.cpp" \
            "$PLAT/tests/AppsSmmuOwnerPeer.cpp" \
            -o "$OUT/test_apps_smmu_owner"
          "$OUT/test_apps_smmu_owner"

          echo "=== Test 2: Sm8250UfsDiagnostics ==="
          clang++ $CXXFLAGS -I"$PLAT" -I"$STOR/include" \
            "$PLAT/Sm8250UfsDiagnostics.cpp" \
            "$PLAT/tests/Sm8250UfsDiagnostics.cpp" \
            -o "$OUT/test_ufs_diagnostics"
          "$OUT/test_ufs_diagnostics"

          echo "=== Test 3: Sm8250UfsHandoff ==="
          clang++ $CXXFLAGS -I"$PLAT" -I"$STOR/include" \
            "$PLAT/AppsSmmuOwner.cpp" \
            "$PLAT/Sm8250UfsHandoff.cpp" \
            "$PLAT/tests/Sm8250UfsHandoff.cpp" \
            -o "$OUT/test_ufs_handoff"
          "$OUT/test_ufs_handoff"

          echo "=== Test 4: Sm8250UfsHci ==="
          clang++ $CXXFLAGS -I"$PLAT" -I"$STOR/include" \
            "$PLAT/AppsSmmuOwner.cpp" \
            "$PLAT/Sm8250UfsHci.cpp" \
            "$PLAT/tests/Sm8250UfsHci.cpp" \
            -o "$OUT/test_ufs_hci"
          "$OUT/test_ufs_hci"

          echo "=== Test 5: Sm8250UfsPipeline ==="
          clang++ $CXXFLAGS -I"$PLAT" -I"$STOR/include" \
            "$PLAT/AppsSmmuOwner.cpp" \
            "$PLAT/Sm8250UfsHandoff.cpp" \
            "$PLAT/Sm8250UfsHci.cpp" \
            "$PLAT/tests/Sm8250UfsPipeline.cpp" \
            -o "$OUT/test_ufs_pipeline"
          "$OUT/test_ufs_pipeline"

          echo "=== Test 6: R41RootWindowModel (SHNGROOT manifest + window slicing) ==="
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I"$STOR/r41" -c "$STOR/r41/R35Record.c" -o "$OUT/R35Record.o"
          clang++ $CXXFLAGS -I"$STOR" -I"$STOR/r41" -I"$STOR/include" -I"$PLAT" \
            "$OUT/R35Record.o" \
            "$PLAT/AppsSmmuOwner.cpp" \
            "$STOR/r41/KnownBlockReference.cpp" \
            "$STOR/r41/R41UfsTransport.cpp" \
            "$STOR/r41/tests/R41RootWindowModel.cpp" \
            -o "$OUT/test_r41_root_window"
          for mode in happy-path bad-manifest-sha overlap-windows no-shngroot; do
            "$OUT/test_r41_root_window" --synthetic "$mode"
          done

          echo "=== Test 7: J716fUsbDebugWire (USB CDC descriptors, CRC32, GSC1 framing) ==="
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            "device/package/usb/tests/J716fUsbDebugWireTest.c" \
            -o "$OUT/test_usb_debug_wire"
          "$OUT/test_usb_debug_wire"

          echo "=== Test 8: J716fBatteryBoard (PM8150B gen4 FG & SMB5 decoding) ==="
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            "device/package/power/tests/J716fBatteryBoardTest.c" \
            -o "$OUT/test_battery_board"
          "$OUT/test_battery_board"

          echo "=== Test 9: J716fGpuPowerBoard (Adreno 650 Phase 1 staged power/clock/SMMU/GMU/cmd-db) ==="
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            "device/package/gpu/tests/J716fGpuPowerBoardTest.c" \
            -o "$OUT/test_gpu_power_board"
          "$OUT/test_gpu_power_board"

          echo "=== Test 10: J716fA650Gmu (Adreno 650 Phase 2 GMU cold-start, HFI startup, GX power) ==="
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I"unixnu/kits/AdrenoFirmware" -I"device/package/gpu" \
            "unixnu/kits/AdrenoFirmware/AdrenoFirmware.c" \
            "unixnu/kits/AdrenoFirmware/AdrenoHfiVotes.c" \
            "unixnu/kits/AdrenoFirmware/AdrenoHfiStartup.c" \
            "device/package/gpu/J716fA650Gmu.c" \
            "device/package/gpu/tests/J716fA650GmuTest.c" \
            -o "$OUT/test_a650_gmu"
          "$OUT/test_a650_gmu"

          echo "=== Test 11: J716fA650GmuContext (KGSL SMMU ArmSmmu4K GMU context, 4K page walk, stream routes) ==="
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I"unixnu/kits/ArmSmmu4K" -I"device/package/gpu" \
            "unixnu/kits/ArmSmmu4K/ArmSmmu4K.c" \
            "unixnu/kits/ArmSmmu4K/ArmSmmu4KContext.c" \
            "unixnu/kits/ArmSmmu4K/ArmSmmu4KProgram.c" \
            "unixnu/kits/ArmSmmu4K/ArmSmmu4KStreams.c" \
            "device/package/gpu/J716fA650GmuContext.c" \
            "device/package/gpu/tests/J716fA650GmuContextTest.c" \
            -o "$OUT/test_a650_gmu_context"
          "$OUT/test_a650_gmu_context"

          echo "=== Test 12: J716fA650Cp (Phase 3 Bank 0 GPU SMMU + A650 hw_init + SQE/CP PM4 Ring 0) ==="
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I"unixnu/kits/ArmSmmu4K" -I"unixnu/kits/AdrenoPM4" -I"device/package/gpu" \
            "unixnu/kits/ArmSmmu4K/ArmSmmu4K.c" \
            "unixnu/kits/ArmSmmu4K/ArmSmmu4KContext.c" \
            "unixnu/kits/ArmSmmu4K/ArmSmmu4KProgram.c" \
            "unixnu/kits/ArmSmmu4K/ArmSmmu4KStreams.c" \
            "unixnu/kits/AdrenoPM4/AdrenoPM4.c" \
            "device/package/gpu/J716fA650GmuContext.c" \
            "device/package/gpu/J716fA650Cp.c" \
            "device/package/gpu/tests/J716fA650CpTest.c" \
            -o "$OUT/test_a650_cp"
          "$OUT/test_a650_cp"

          echo "=== Test 13: J716fA650Zap (Phase 3b ELF32 MDT, SCM PAS 13, PIL unmap order, CP aperture) ==="
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            -I"device/package/gpu" \
            "device/package/gpu/J716fA650Zap.c" \
            "device/package/gpu/tests/J716fA650ZapTest.c" \
            -o "$OUT/test_a650_zap"
          "$OUT/test_a650_zap"

          echo "=== Test 14: J716fPersistentStore (opt-in UFS Data store write-guard, WRITE(10)/SYNC, quarantine) ==="
          clang++ $CXXFLAGS -I"$STOR" -I"$STOR/r41" -I"$STOR/include" -I"$PLAT" \
            "$OUT/R35Record.o" \
            "$PLAT/AppsSmmuOwner.cpp" \
            "$STOR/r41/KnownBlockReference.cpp" \
            "$STOR/r41/R41UfsTransport.cpp" \
            "$STOR/r41/tests/J716fPersistentStoreTest.cpp" \
            -o "$OUT/test_persistent_store"
          "$OUT/test_persistent_store"

          echo "=== Test 15: J716fBacklightDsi (SM8250 DSI v2.4 TPG FIFO DCS 0x51 11-bit backlight) ==="
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            "device/package/display/tests/J716fBacklightDsiTest.c" \
            -o "$OUT/test_backlight_dsi"
          "$OUT/test_backlight_dsi"

          echo "=== Test 16: J716fDpuSmmu (SM8250 DPU 6.0 MDP observation & Stage-1 SMMU 4K tables) ==="
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            "device/package/display/tests/J716fDpuSmmuTest.c" \
            -o "$OUT/test_dpu_smmu"
          "$OUT/test_dpu_smmu"

          echo "=== Test 17: J716fWcnBoard (QCA6390 BT version parser, PCIe0 SID CRC-8, QMP PHY table) ==="
          clang -std=c11 -O1 -g -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer \
            "device/package/wireless/tests/J716fWcnBoardTest.c" \
            -o "$OUT/test_wcn_board"
          "$OUT/test_wcn_board"

      - name: Run upstream GopFramebuffer fence-wait sanitizer regression check
        run: |
          (cd unixnu/drivers/GopFramebuffer && python3 Test/check-fence-wait.py)

      - name: Validate structured porting.toml against official UniXNU schema
        run: |
          python3 unixnu/scripts/porting-record.py check --device device

      - name: Summary
        run: |
          {
            echo '## J716F Device CI'
            echo '- Official `./unixnu` Format 2 `defconfig`, `status`, `tree`, and `build package` passed'
            echo '- `dts/j716f.dts` compiled with `dtc` and converted to valid Apple Device Tree (ADT)'
            echo '- All 17 C/C++ ASan/UBSan storage/SMMU/SHNGROOT/persistent-store/USB/battery/GPU/GMU/CP/ZAP/backlight/DPU/WCN unit tests compiled and passed'
            echo '- Python Data seed, Phase 4b GPU packer, & USB GSC1 wire tests and `porting.toml` schema validation passed'
          } >> "$GITHUB_STEP_SUMMARY"
