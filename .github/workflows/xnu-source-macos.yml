name: J716F XNU source build

on:
  workflow_dispatch:
    inputs:
      native_arch_timer:
        description: 'Qualify native architectural timer source (no ArmCpu/prelink/device boot)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/xnu-source-macos.yml'
      - 'configs/j716f_source_defconfig'
      - 'configs/j716f_arch_timer_source_defconfig'
      - 'scripts/build-j716f-source.py'
      - 'scripts/source-artifact-transfer.py'
      - 'ci/source-artifacts-public.pem'
      - 'patches/build-driver/0002-guard-optional-legacy-display-probe.patch'
      - 'patches/build-driver/0003-allow-boot-progress-without-sheng-pmgr.patch'
      - 'patches/build-driver/0004-restore-xnu-headers-after-reclone.patch'
      - 'board.toml'
      - 'feeds.toml'
      - 'dts/**'
      - 'socs/**'
      - 'porting.toml'
      - 'unixnu.lock'

permissions:
  contents: read

concurrency:
  group: j716f-xnu-source-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  source:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - name: Check out the J716F configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: device

      - name: Check out the pinned official UniXNU build driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: UniXNU/UniXNU
          ref: 42bffe8a56823dad2e448c776b4f94862f3e290a
          persist-credentials: false
          path: unixnu

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install host tools
        run: |
          set -euo pipefail
          test -d "$DEVELOPER_DIR"
          brew install llvm lld
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi

      - name: Report toolchain
        run: |
          set -euo pipefail
          mkdir -p unixnu/out/j716f
          {
            sw_vers
            uname -m
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            xcrun --sdk iphoneos --find mig
            clang --version
            python3 --version
            git -C unixnu rev-parse HEAD
            git -C device rev-parse HEAD
            df -h "$GITHUB_WORKSPACE"
          } | tee unixnu/out/j716f/toolchain.log
          for tool in git make clang cmake ninja unifdef xcodebuild; do
            command -v "$tool"
          done

      - name: Build source XNU, pthread and corecrypto
        env:
          GITHUB_TOKEN: ${{ github.token }}
          J716F_NATIVE_TIMER: ${{ inputs.native_arch_timer }}
        run: |
          set -euo pipefail
          timer_args=()
          if [[ "$J716F_NATIVE_TIMER" == "true" ]]; then
            timer_args+=(--native-arch-timer)
          fi
          python3 device/scripts/build-j716f-source.py \
            --unixnu "$GITHUB_WORKSPACE/unixnu" \
            --device "$GITHUB_WORKSPACE/device" --jobs 3 \
            "${timer_args[@]}" \
            2>&1 | tee unixnu/out/j716f/source-driver.log

      - name: Stage text logs and reports
        if: always()
        run: |
          python3 - <<'PY'
          import shutil
          from pathlib import Path
          root = Path('unixnu/out/j716f')
          target = Path('public-logs')
          target.mkdir(exist_ok=True)
          candidates = [path for path in root.rglob('*') if path.is_file()]
          # Only the following source archive diagnostics are added. No binary,
          # IPSW, kernelcache, payload or full build directory is uploaded.
          for folder in ('corecrypto-2023', 'libpthread-kernel'):
              builds = list(root.rglob('tree/build/' + folder))
              for build in builds:
                  candidates.extend(build.glob('*.json'))
                  candidates.extend(build.rglob('*.log'))
          for path in candidates:
              if not path.is_file() or path.suffix not in ('.log', '.json'):
                  continue
              data = path.read_bytes()
              if b'\0' in data:
                  continue
              name = '__'.join(path.relative_to(root).parts)
              (target / name).write_text(data.decode('utf-8', 'replace'))
          PY

      - name: Upload text diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: j716f-xnu-source-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: public-logs/
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          {
            echo '## J716F XNU source build'
            echo
            echo 'Target: ARM64 / BCM2837 4 KiB / DEVELOPMENT / iOS 17 ABI.'
            echo 'Source dependencies: libpthread, corecrypto, libplatform, libdispatch and AvailabilityVersions.'
            echo 'This run performs source compilation only. It does not perform prelink or prove a J716F boot.'
            echo 'Text diagnostics and an encrypted source-output bundle are uploaded. Only the local private key can decrypt the bundle.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt source outputs for local bring-up
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input cryptography==46.0.6
          reports="$(find unixnu/out/j716f -type f -path '*/logs/source-build-report.json' -print)"
          test -n "$reports"
          test "$(printf '%s\n' "$reports" | wc -l | tr -d ' ')" -eq 1
          report="$reports"
          root="${report%/logs/source-build-report.json}/tree"
          echo "transfer: report = $report"
          echo "transfer: root = $root"
          SOURCE_TREE="$root" SOURCE_REPORT="$report" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization

          root = Path(os.environ['SOURCE_TREE'])
          report_path = Path(os.environ['SOURCE_REPORT'])
          key_path = Path('device/ci/source-artifacts-public.pem')
          report = json.loads(report_path.read_text())
          print('transfer: cryptography import ok')
          print('transfer: report status =', report.get('status'))
          print('transfer: prelink performed =', report.get('prelink_performed'))
          print('transfer: manifest entries =', len(report.get('artifacts', [])))
          for entry in report.get('artifacts', []):
              path = root / entry['path']
              print('transfer: output', entry['path'], 'bytes=', path.stat().st_size,
                    'reported=', entry['bytes'])
          key = serialization.load_pem_public_key(key_path.read_bytes())
          print('transfer: public key type =', type(key).__name__,
                'bits =', key.key_size)
          PY
          SOURCE_TREE="$root" SOURCE_REPORT="$report" python3 device/scripts/source-artifact-transfer.py seal \
            --root "$root" \
            --report "$report" \
            --public-key device/ci/source-artifacts-public.pem \
            --output private-transfer/j716f-source-only.enc

      - name: Upload encrypted source outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: j716f-source-encrypted-${{ github.run_id }}-${{ github.run_attempt }}
          path: private-transfer/j716f-source-only.enc
          if-no-files-found: error
          retention-days: 3
