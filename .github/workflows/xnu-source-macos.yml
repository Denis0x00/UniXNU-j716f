name: J716F XNU source build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: j716f-xnu-source-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  driver-and-source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install device-tree compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq device-tree-compiler

      - name: Validate board configuration, DTB compilation, and proprietary firmware manifest
        run: |
          set -euo pipefail
          dtc -I dts -O dtb -i socs/sm8250/dts dts/j716f.dts -o /tmp/j716f-hardware.dtb
          test -s /tmp/j716f-hardware.dtb
          python3 scripts/check-j716f.py
          python3 - <<'PY'
          import re
          import tomllib
          from pathlib import Path
          board = tomllib.loads(Path('board.toml').read_text())
          assert board['board']['name'] == 'j716f'
          assert board['board']['soc'] == 'SM8250'
          assert 'j716f-touch=1' in board['payload']['kernel_args']
          assert 'j716f-usb=1' in board['payload']['kernel_args']
          assert 'pipa-gpu=12' in board['payload']['kernel_args']
          assert 'sheng-gpu-addon=1' in board['payload']['kernel_args']
          assert 'sheng-fb-gpu=1' in board['payload']['kernel_args']
          assert 'sheng-tum=s' in board['payload']['kernel_args']
          lines = [
              ln.strip() for ln in Path('proprietary-files.txt').read_text().splitlines()
              if ln.strip() and not ln.strip().startswith('#')
          ]
          assert len(lines) >= 10
          for ln in lines:
              parts = [p.strip() for p in ln.split('|')]
              assert len(parts) == 4 and re.fullmatch(r'[0-9a-f]{64}', parts[2]), f'Bad entry: {ln}'
          print(f'Verified board.toml, hardware.dtb, and {len(lines)} proprietary firmware SHA-256 entries')
          PY

      - name: Compile and run J716F driver unit tests (GCC and Clang -Werror)
        run: |
          set -euo pipefail
          for cc in gcc clang; do
            "$cc" -std=c11 -O2 -Wall -Wextra -Werror -I package package/ButtonsTests.c -o /tmp/buttons-test-"$cc"
            /tmp/buttons-test-"$cc"
            "$cc" -std=c11 -O2 -Wall -Wextra -Werror -I package package/TouchBoardTests.c -o /tmp/touch-test-"$cc"
            /tmp/touch-test-"$cc"
            "$cc" -std=c11 -O2 -Wall -Wextra -Werror -I package package/GpuPowerBoardTests.c -o /tmp/gpu-power-test-"$cc"
            /tmp/gpu-power-test-"$cc"
            "$cc" -std=c11 -O2 -Wall -Wextra -Werror -I package package/NativeBatteryTests.c -o /tmp/battery-test-"$cc"
            /tmp/battery-test-"$cc"
            "$cc" -std=c11 -O2 -Wall -Wextra -Werror -I drivers/GopFramebuffer drivers/GopFramebuffer/Test/request-state.c -o /tmp/gop-test-"$cc"
            /tmp/gop-test-"$cc"
            "$cc" -std=c11 -O2 -Wall -Wextra -Werror -c package/QcomRpmh.c -o /tmp/qcom-rpmh-"$cc".o
          done
          for cxx in g++ clang++; do
            "$cxx" -std=c++17 -O2 -Wall -Wextra -Werror -I package package/UsbDebugTests.cpp -o /tmp/usb-test-"$cxx"
            /tmp/usb-test-"$cxx"
          done

      - name: Validate Apple DeviceTree (ADT) generation
        run: |
          set -euo pipefail
          python3 scripts/make-j716f-adt.py --output /tmp/j716f-adt.bin
          test -s /tmp/j716f-adt.bin
