name: First-install iPadOS Data seed

on:
  workflow_dispatch:
    inputs:
      data_gib:
        description: New installation logical Data size in GiB (preserve the result)
        required: true
        type: choice
        default: '16'
        options: ['3', '4', '8', '16', '32', '64']
  push:
    tags:
      - 'run-data-seed-*'

permissions:
  contents: read

concurrency:
  group: first-install-data-seed-${{ github.repository }}
  cancel-in-progress: false

jobs:
  data-seed:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DATA_GIB: ${{ inputs.data_gib || '16' }}
    steps:
      - name: Checkout public workflow and scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          submodules: false

      - name: Checkout fixed official UniXNU
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: UniXNU/UniXNU
          ref: 7b730b231746667d8b7f54746c2c1ce45852611c
          path: .ci-unixnu
          persist-credentials: false
          submodules: false

      - name: Fetch only the pinned packed Data helper
        shell: bash
        run: git -C .ci-unixnu submodule update --init --depth=1 drivers/DarwinBoot

      - name: Select Python 3.12 explicitly
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Create and verify fresh Data on macOS
        shell: bash
        env:
          PYTHON_BIN: ${{ steps.python.outputs.python-path }}
        run: |
          sudo -n "$PYTHON_BIN" scripts/ci/make_data_seed.py \
            --core "$GITHUB_WORKSPACE/.ci-unixnu" \
            --work "$RUNNER_TEMP/j716f-data-seed-work" \
            --output "$RUNNER_TEMP/j716f-data-seed-artifact" \
            --evidence "$RUNNER_TEMP/j716f-data-seed-evidence" \
            --gib "$DATA_GIB"

      - name: Detach only this job's disk images
        if: always() && steps.python.outcome == 'success'
        shell: bash
        env:
          PYTHON_BIN: ${{ steps.python.outputs.python-path }}
        run: |
          sudo -n "$PYTHON_BIN" scripts/ci/make_data_seed.py \
            --core "$GITHUB_WORKSPACE/.ci-unixnu" \
            --work "$RUNNER_TEMP/j716f-data-seed-work" \
            --output "$RUNNER_TEMP/j716f-data-seed-artifact" \
            --evidence "$RUNNER_TEMP/j716f-data-seed-evidence" \
            --cleanup-only

      - name: Upload verified installation seed
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data-21H461-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/j716f-data-seed-artifact/data-21H461.dbr
            ${{ runner.temp }}/j716f-data-seed-artifact/data-21H461.json
            ${{ runner.temp }}/j716f-data-seed-artifact/SHA256SUMS
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Upload sanitized creation evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/j716f-data-seed-evidence/*.json
            ${{ runner.temp }}/j716f-data-seed-evidence/*.log
          if-no-files-found: warn
          compression-level: 6
          retention-days: 14
